name: Update site data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0,6,12,18 * * *"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: update-site-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install updater dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh direct ADP and rankings
        run: python refresh_draft_board.py --keep-stats --skip-workbook
      - name: Build the player-news timeline
        run: python update_player_news.py
      - name: Build current and historical player archive
        run: python update_player_history.py
      - name: Build the weekly NFL odds board
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
        run: python update_odds_board.py
      - name: Build the survivor matrix and team ratings
        run: python update_survivor_board.py
      - name: Publish updated site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ADP/combined_adp_2026.csv data/ADP/special_teams_adp_2026.csv docs/data/rankings.json docs/data/special_teams.json docs/data/player_news.json docs/data/player_history.json docs/data/nfl_odds.json docs/data/survivor.json
          if git diff --cached --quiet; then
            echo "The published site data is already current."
          else
            git commit -m "Update ADP, rankings, player news, odds, and survivor model"
            git push
          fi
