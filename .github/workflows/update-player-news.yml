name: Update site data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/refresh_site.py", "app/player_news.py", ".github/workflows/update-player-news.yml"]
  schedule:
    - cron: "0 0,6,12,18 * * *"
      timezone: "America/New_York"

permissions:
  contents: write
  pages: write

concurrency:
  group: update-site-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install updater dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh all site snapshots independently
        id: refresh
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
        run: python scripts/refresh_site.py
      - name: Publish updated site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ADP/combined_adp_2026.csv data/ADP/special_teams_adp_2026.csv data/stats/nflverse_player_stats_2025.csv docs/data/rankings.json docs/data/special_teams.json docs/data/player_news.json docs/data/player_history.json docs/data/draft_capital_history.json docs/data/nfl_odds.json docs/data/survivor.json docs/data/update_status.json
          if git diff --cached --quiet; then
            echo "The published site data is already current."
          else
            git commit -m "Update ADP, rankings, player news, odds, and survivor model"
            git pull --rebase origin main
            git push
          fi
      - name: Publish refreshed snapshots to the website
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/request_pages_build.py
      - name: Report any unsuccessful refresh
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "One or more sources failed. Successful snapshots were published; failed sources kept last-good data. See the refresh log and update_status.json."
          exit 1
