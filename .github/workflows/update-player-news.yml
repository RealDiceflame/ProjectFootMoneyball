name: Update factual player news

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install updater dependencies
        run: python -m pip install pandas requests
      - name: Build the player-news timeline
        run: python update_player_news.py
      - name: Publish updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/player_news.json
          if git diff --cached --quiet; then
            echo "The published player news is already current."
          else
            git commit -m "Update factual player news"
            git push
          fi
