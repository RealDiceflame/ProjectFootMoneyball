name: Update player values

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/player_values.py', 'update_player_values.py', 'docs/player-values.mjs', 'scripts/record_player_values.mjs', '.github/workflows/update-player-values.yml']
  workflow_run:
    workflows: ['Update site data', 'Update game stats']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '30 0,6,12,18 * * *'
      timezone: America/New_York

permissions:
  contents: write
  pages: write

concurrency:
  group: update-player-values
  cancel-in-progress: false

jobs:
  values:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only the default-branch source is executed, never an upstream run's artifact.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export saved observations and record original model values
        run: |
          python update_player_values.py
          node scripts/record_player_values.mjs
      - name: Publish value snapshots
        run: |
          git add docs/data/player_value_inputs.json docs/data/player_values
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update recorded rest-of-season and dynasty values'
            python scripts/push_snapshot.py
          fi
      - name: Publish refreshed values to the website
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install requests
          python scripts/request_pages_build.py
