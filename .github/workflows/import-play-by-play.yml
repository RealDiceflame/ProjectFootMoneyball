name: Import 2025 play-by-play
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/play_by_play.py", "update_play_by_play.py", ".github/workflows/import-play-by-play.yml"]
permissions:
  contents: write
  pages: write
concurrency:
  group: import-play-by-play
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate all 2025 regular-season games before writing
        run: python update_play_by_play.py
      - name: Commit validated play archive
        run: |
          git add docs/data/play_by_play data/play_by_play
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update validated 2025 play-by-play archive"
            python scripts/push_snapshot.py
          fi
      - name: Confirm Pages publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install requests
          python scripts/request_pages_build.py
