name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build Windows app
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v7
        with:
          path: releases/current/ProjectFootMoneyball-Windows.zip
          archive: false

  macos:
    name: macOS (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            label: Apple Silicon
            suffix: Apple-Silicon
          - runner: macos-15-intel
            label: Intel
            suffix: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python3 -m pytest -q
      - name: Build macOS app
        run: bash scripts/build_macos.sh "${{ matrix.suffix }}"
      - name: Upload macOS ZIP
        uses: actions/upload-artifact@v7
        with:
          path: releases/current/ProjectFootMoneyball-macOS-${{ matrix.suffix }}.zip
          archive: false

  release:
    name: Attach builds to tagged release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download completed builds
        uses: actions/download-artifact@v8
        with:
          pattern: ProjectFootMoneyball-*.zip
          path: release-assets
          merge-multiple: true
      - name: Create pre-release and attach apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --prerelease
          gh release upload "$GITHUB_REF_NAME" release-assets/*.zip --clobber
