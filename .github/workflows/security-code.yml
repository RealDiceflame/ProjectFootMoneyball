name: Security code scan
on:
  push:
    branches: [main]
    paths: ["**.py", "**.js", "**.mjs", ".github/workflows/security-code.yml", ".github/codeql-config.yml"]
  pull_request:
    paths: ["**.py", "**.js", "**.mjs", ".github/workflows/security-code.yml", ".github/codeql-config.yml"]
  schedule:
    - cron: "41 9 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: code-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@800a1d8701a65d150a672fef0923dbf2660a62ec # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: .github/codeql-config.yml
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: "/language:${{ matrix.language }}"
