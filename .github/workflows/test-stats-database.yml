name: Test stats database
on:
  push:
    branches: [main]
    paths: ["database/**", "database_stats.py", "app/stats_*.py", "requirements-database.txt", "tests/test_stats_*.py", ".github/workflows/test-stats-database.yml", ".github/workflows/sync-stats-database.yml"]
  pull_request:
    paths: ["database/**", "database_stats.py", "app/stats_*.py", "requirements-database.txt", "tests/test_stats_*.py", ".github/workflows/test-stats-database.yml", ".github/workflows/sync-stats-database.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: outlier_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d outlier_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install database test tools
        run: python -m pip install -r requirements-database.txt pytest
      - name: Validate saved archive without a database
        run: python database_stats.py plan
      - name: Test imports, history, SQL totals and rollback on disposable PostgreSQL
        env:
          OUTLIER_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-test-only@127.0.0.1:5432/outlier_test
        run: python -m pytest tests/test_stats_*.py -q
