name: Update original rankings

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/coaching.py', 'app/simulation_inputs.py', 'update_coaching.py', 'update_simulation.py', 'data/coaching_play_callers.json', 'docs/matchup-simulation.mjs', 'scripts/record_simulation.mjs', 'docs/simulation-values.mjs', 'scripts/record_player_values.mjs', 'app/ranking_inputs.py', 'app/defender_inputs.py', 'app/player_values.py', 'update_rankings.py', 'update_defender_status.py', 'docs/ranking-model.mjs', 'docs/defender-model.mjs', 'docs/player-values.mjs', 'docs/projection-model.mjs', 'docs/player-history.mjs', 'docs/fantasy-scoring.mjs', 'docs/injury-status.mjs', 'scripts/record_rankings.mjs', '.github/workflows/update-rankings.yml']
  workflow_run:
    workflows: ['Update site data', 'Update game stats', 'Update snap counts']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '40 0,6,12,18 * * *'
      timezone: America/New_York

permissions:
  contents: write
  pages: write

concurrency:
  group: update-original-rankings
  cancel-in-progress: false

jobs:
  rankings:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Execute default-branch source only, never upstream artifacts or PR code.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install coaching parser
        run: python -m pip install beautifulsoup4
      - name: Validate archive and build all original ranking views
        run: |
          python update_defender_status.py
          python update_rankings.py
          node scripts/record_rankings.mjs
          python update_coaching.py
          python update_simulation.py --cache-dir "${{ runner.temp }}/simulation-inputs"
          node scripts/record_simulation.mjs
          node scripts/record_player_values.mjs --simulation
      - name: Publish complete ranking snapshots
        run: |
          git add docs/data/simulation_values docs/data/coaching_staff.json docs/data/simulation_inputs.json docs/data/simulation_forecasts.json data/defender_status docs/data/defender_status.json docs/data/ranking_inputs.json docs/data/ranking_forecasts.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update original draft, weekly, ROS and defense forecasts'
            python scripts/push_snapshot.py
          fi
      - name: Publish refreshed rankings to the website
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install requests
          python scripts/request_pages_build.py
